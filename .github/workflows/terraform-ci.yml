name: Terraform CI

on:
  push:
    branches: [ main, feature/*, bugfix/*, release/* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  terraform-checks:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        terraform_version: ["1.11.4", "latest"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ matrix.terraform_version }}

    - name: Terraform Format Check
      run: terraform fmt -check -recursive

    # Checkov scans source, not Terraform behavior, so run it once per workflow
    - name: Setup Checkov
      if: matrix.terraform_version == 'latest'
      run: |
        python -m pip install --upgrade pip
        pip install checkov

    - name: Run Checkov Security Scan
      if: matrix.terraform_version == 'latest'
      run: |
        checkov --framework terraform \
                --directory . \
                --output cli \
                --output sarif \
                --output-file-path console,checkov-report.sarif \
                --skip-check CKV_AWS_144 \
                --quiet
      continue-on-error: false

    # always() so findings are published even when the scan fails; skip if the scan never ran
    - name: Upload Checkov SARIF results
      if: always() && matrix.terraform_version == 'latest' && hashFiles('checkov-report.sarif') != ''
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: checkov-report.sarif
        category: checkov

    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@v6
      with:
        tflint_version: v0.64.0

    - name: Show TFLint version
      run: tflint --version

    - name: Init TFLint
      run: tflint --init
      env:
        # Avoid GitHub API rate limits when downloading the AWS ruleset plugin
        GITHUB_TOKEN: ${{ github.token }}

    # Matches `make lint`
    - name: Run TFLint
      run: tflint --recursive -f compact

    # Root module validation skipped - requires provider configuration
    # Root module is designed to be used as a module with providers passed in

    - name: Terraform Init (Modules)
      run: |
        for module in modules/*/; do
          # Skip when the repository has no submodules (glob stays unexpanded)
          [ -d "$module" ] || continue
          echo "Initializing $module"
          cd "$module"
          terraform init -backend=false
          cd - > /dev/null
        done

    - name: Terraform Validate (Modules)
      run: |
        for module in modules/*/; do
          # Skip when the repository has no submodules (glob stays unexpanded)
          [ -d "$module" ] || continue
          echo "Validating $module"
          cd "$module"
          terraform validate
          cd - > /dev/null
        done

    - name: Terraform Init (Examples)
      run: |
        for example in examples/*/; do
          echo "Initializing $example"
          cd "$example"
          terraform init -backend=false
          cd - > /dev/null
        done

    - name: Terraform Validate (Examples)
      run: |
        for example in examples/*/; do
          echo "Validating $example"
          cd "$example"
          terraform validate
          cd - > /dev/null
        done

  terraform-tests:
    name: Terraform Tests
    runs-on: ubuntu-latest
    environment: development
    needs: terraform-checks
    strategy:
      matrix:
        terraform_version: ["1.11.4", "latest"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        role-session-name: terraform-ci-tests
        aws-region: us-east-1
        audience: sts.amazonaws.com
        retry-max-attempts: 3
        output-credentials: true


    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ matrix.terraform_version }}

    # Uncomment the following lines to run Terratest
    - name: Run Terratest
      env:
        TF_VAR_name_prefix: "ci-test"
        TF_VAR_environment_type: "Development"
        TF_VAR_tags: '{"Environment":"ci","Project":"terraform-module","ManagedBy":"github-actions"}'
      run: |
        cd test
        go mod tidy
        go test -v -timeout 30m
